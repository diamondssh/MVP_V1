<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>집중 타이머</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <section class="timer-container" aria-labelledby="timerTitle">
      <div class="title-row">
        <div>
          <h1 id="timerTitle">집중 타이머</h1>
          <p class="subtitle">분과 초를 입력한 뒤 원하는 시간만큼 집중하세요.</p>
        </div>
        <div id="status" class="status-pill" aria-live="polite">대기</div>
      </div>

      <div class="timer-face" id="timerFace" aria-label="남은 시간">
        <div id="timeDisplay" class="time-display" aria-live="polite">00:00</div>
      </div>

      <div class="input-group">
        <div>
          <label for="minutes">분</label>
          <input id="minutes" type="number" min="0" max="999" inputmode="numeric" placeholder="0" />
        </div>

        <div>
          <label for="seconds">초</label>
          <input id="seconds" type="number" min="0" max="59" inputmode="numeric" placeholder="0" />
        </div>
      </div>

      <div class="button-group">
        <button id="startBtn" class="start" type="button">시작</button>
        <button id="pauseBtn" class="pause" type="button" disabled>일시정지</button>
        <button id="resumeBtn" class="resume" type="button" disabled>계속</button>
        <button id="resetBtn" class="reset" type="button">초기화</button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
